name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install handlers-sdk
        # Contract/integration tests spawn real Python workers (internal/handler/workerpool),
        # so the Go test job needs the SDK installed too, not just the Python job below.
        run: pip install -e ./handlers-sdk
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
      - name: Test
        run: go test ./... -race -count=1

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ./handlers-sdk[dev]
      - name: Lint
        run: ruff check handlers-sdk python
      - name: Test
        run: pytest python/tests
