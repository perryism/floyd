# Example --config file for api-gateway.
#
# Run from the repository root:
#   make build
#   make venv
#   GATEWAY_PYTHON="$(pwd)/.venv/bin/python3" \
#     ./gateway --host 0.0.0.0 --port 1235 --config examples/config.yaml
#
# See README.md and specs/001-handler-injection/quickstart.md for the full reference.

# When true, the gateway logs each request's method, path, and response status to its
# standard log output.
verbose: true

endpoints:
  - name: app1
    description: A route with no handlers at all -- plain pass-through proxying.
    dest: http://127.0.0.1:18081
    # Headers injected into every request forwarded to this backend. ${VAR} is replaced
    # from the gateway's environment at startup (startup fails if VAR is unset).
    # headers:
    #   API_TOKEN: ${API_TOKEN}
    #   X_HEADER: foo
    # Set when the backend's pages use root-relative URLs like "/assets.css": rewrites them
    # to "/app1/assets.css" (HTML/CSS bodies, Location, Set-Cookie, plus a Referer-based
    # redirect for JS requests). Not valid together with single_endpoint.
    # rewrite_paths: true

  - name: app2
    description: >-
      A route with a single request handler that stamps every request with an
      X-Request-Id header if the caller didn't already send one.
    dest: http://127.0.0.1:18082
    handlers: ./examples/handlers/add_request_id.py

  - name: app3
    description: >-
      A route chaining two handlers in order -- "handlers" accepts a list, not
      just a single path, to run several handlers in sequence.
    dest: http://127.0.0.1:18083
    handlers:
      - ./examples/handlers/null_handler.py
      - ./examples/handlers/add_request_id.py
